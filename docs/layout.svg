<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4493f8"/>
    </marker>
  </defs>

  <style>
    .lbl   { fill: #8b949e; font-size: 15px; }
    .sub   { fill: #8b949e; font-size: 12.5px; opacity: .85; }
    .head  { fill: #8b949e; font-size: 16px; font-weight: 600; }
    .coord { fill: #4493f8; font-size: 12px; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
    .panel { fill: none; stroke: #8b949e; stroke-width: 1; stroke-dasharray: 4 4; opacity: .35; }
    .lap   { fill: #8b949e; fill-opacity: .13; stroke: #8b949e; stroke-width: 2; }
    .ext   { fill: #4493f8; fill-opacity: .16; stroke: #4493f8; stroke-width: 2; }
    .base  { stroke: #4493f8; stroke-width: 1.5; stroke-dasharray: 6 5; opacity: .75; }
  </style>

  <!-- ============ LEFT PANEL : landscape ============ -->
  <rect class="panel" x="24" y="52" width="392" height="316" rx="10"/>
  <text class="head" x="44" y="40">Landscape · 橫向 0°</text>

  <!-- external 1920x1080 -> 160x90 ; laptop 1920x1080 -> 160x90 ; bottoms level -->
  <rect class="ext" x="74"  y="188" width="160" height="90" rx="4"/>
  <rect class="lap" x="234" y="188" width="160" height="90" rx="4"/>

  <text class="lbl"   x="154" y="228" text-anchor="middle">MSI</text>
  <text class="sub"   x="154" y="246" text-anchor="middle">1920 × 1080</text>
  <text class="lbl"   x="314" y="228" text-anchor="middle">Laptop</text>
  <text class="sub"   x="314" y="246" text-anchor="middle">1920 × 1080</text>

  <line class="base" x1="48" y1="278" x2="404" y2="278"/>
  <text class="coord" x="70" y="300">pos = (-1920, 0)</text>
  <text class="sub"  x="70" y="320">bottom edges level · 下緣切齊</text>

  <!-- ============ arrow ============ -->
  <line x1="432" y1="233" x2="482" y2="233" stroke="#4493f8" stroke-width="2"
        marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text class="sub" x="457" y="216" text-anchor="middle">click · 點一下</text>

  <!-- ============ RIGHT PANEL : portrait ============ -->
  <rect class="panel" x="500" y="52" width="392" height="316" rx="10"/>
  <text class="head" x="520" y="40">Portrait · 直向 270°</text>

  <!-- external 1080x1920 -> 90x160 ; bottom stays level with laptop -->
  <rect class="ext" x="580" y="118" width="90"  height="160" rx="4"/>
  <rect class="lap" x="670" y="188" width="160" height="90"  rx="4"/>

  <text class="lbl" x="625" y="192" text-anchor="middle">MSI</text>
  <text class="sub" x="625" y="210" text-anchor="middle">1080 × 1920</text>
  <text class="lbl" x="750" y="228" text-anchor="middle">Laptop</text>
  <text class="sub" x="750" y="246" text-anchor="middle">1920 × 1080</text>

  <line class="base" x1="524" y1="278" x2="880" y2="278"/>
  <text class="coord" x="580" y="300">pos = (-1080, -840)</text>
  <text class="sub"  x="580" y="320">still left · still level · 仍在左邊、仍然切齊</text>

  <!-- ============ footer note ============ -->
  <text class="sub" x="24" y="392">The side and the shared edge survive every rotation, unplug and reconnect.</text>
  <text class="sub" x="24" y="410">每次轉向、拔插、重新連接，都保持同一側與同一條基準線。</text>
</svg>
